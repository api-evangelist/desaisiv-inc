name: Desaisiv Inc.
description: >-
  DESAISIV is a corporate InsurTech platform focused on health insurance in Saudi Arabia and the
  wider MENA region. Founded in 2022, the company builds AI and automation products for insurers and
  third-party administrators (TPAs), including smart underwriting automation, a real-time quotation
  engine, OCR-powered claims intelligence, a corporates insurance marketplace, and SME portals. Its
  platform bridges data, systems, insurers, and corporates to streamline underwriting, quoting, and
  claims. DESAISIV is backed by 500 Global, Terra VC, Oqal, and other MENA/UK/US investors via a
  US$2M pre-seed round. This profile is maintained in the API Evangelist network; the company does
  not currently publish a public developer portal or API.
